id: mst-edge-sort
title: MST edge sort probe
language: cpp
status: experimental
safety: safe
entrypoint:
  file: main.cpp
  build: cmake-or-g++
  debug: gdb
commands:
  build:
    argv:
      - python3
      - lab_build.py
      - build
  compile:
    argv:
      - python3
      - lab_build.py
      - compile
  run:
    argv:
      - .generated/build/mst-edge-sort
  test:
    argv:
      - .generated/build/mst-edge-sort
subtests:
  sort_order:
    argv:
      - .generated/build/mst-edge-sort_sort_order
  sort_preserves_edges:
    argv:
      - .generated/build/mst-edge-sort_sort_preserves_edges
  min_edge_first:
    argv:
      - .generated/build/mst-edge-sort_min_edge_first
debug:
  type: cppdbg
  program: .generated/build/mst-edge-sort
  cwd: .
  stopAtEntry: false
  MIMode: gdb
outputs:
  artifacts_dir: .DevJota/lab/mst-edge-sort
