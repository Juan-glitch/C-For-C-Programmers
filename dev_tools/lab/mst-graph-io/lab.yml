id: mst-graph-io
title: MST Graph I/O probe
language: cpp
status: experimental
safety: safe
entrypoint:
  file: main.cpp
  build: cmake-or-g++
  debug: gdb
commands:
  build:
    argv:
      - python3
      - lab_build.py
      - build
  compile:
    argv:
      - python3
      - lab_build.py
      - compile
  run:
    argv:
      - .generated/build/mst-graph-io
  test:
    argv:
      - .generated/build/mst-graph-io
subtests:
  load_basic:
    argv:
      - .generated/build/mst-graph-io_load_basic
  node_count:
    argv:
      - .generated/build/mst-graph-io_node_count
  edge_count:
    argv:
      - .generated/build/mst-graph-io_edge_count
debug:
  type: cppdbg
  program: .generated/build/mst-graph-io
  cwd: .
  stopAtEntry: false
  MIMode: gdb
outputs:
  artifacts_dir: .DevJota/lab/mst-graph-io
