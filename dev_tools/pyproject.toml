[project]
name = "c-for-c-dev-tools"
version = "0.1.0"
description = "Human Plugin OS devtools for C-For-C-Programmers"
requires-python = ">=3.11"
dependencies = [
    "devtools-core @ file:///app/devtools-core",
]

[project.scripts]
devtools = "devtools:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["devtools", "lab_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
